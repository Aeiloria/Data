<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1828"/>
      <stop offset="80%" stop-color="#04070e"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="neonTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#00aa88"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="#1a2636" stroke-width="4"/>

  <!-- Geometric Grid Matrix Circles & Crosshairs -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1a2636" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00ffcc" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#00ffcc" stroke-width="3" filter="url(#glow)"/>

  <!-- Crosshair axes -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#1a2636" stroke-width="2"/>
  <line x1="40" y1="256" x2="472" y2="256" stroke="#1a2636" stroke-width="2"/>

  <!-- 12D Maharic Shield / Merkabah Geometry -->
  <polygon points="256,120 374,324 138,324" fill="none" stroke="#00ffcc" stroke-width="4" filter="url(#glow)"/>
  <polygon points="256,392 374,188 138,188" fill="none" stroke="#00ffcc" stroke-width="4" filter="url(#glow)"/>

  <!-- Core Pulsing Node -->
  <circle cx="256" cy="256" r="22" fill="#00ffcc" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="10" fill="#ffffff"/>

  <!-- Corner Brackets -->
  <path d="M 90 140 L 90 90 L 140 90" fill="none" stroke="#00ffcc" stroke-width="4"/>
  <path d="M 422 140 L 422 90 L 372 90" fill="none" stroke="#00ffcc" stroke-width="4"/>
  <path d="M 90 372 L 90 422 L 140 422" fill="none" stroke="#00ffcc" stroke-width="4"/>
  <path d="M 422 372 L 422 422 L 372 422" fill="none" stroke="#00ffcc" stroke-width="4"/>
</svg>
